<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Command centre: Ashwin at the centre of five technical domains — AI and agentic AI, cybersecurity, software, data and ML, cloud and systems.">
<defs>
