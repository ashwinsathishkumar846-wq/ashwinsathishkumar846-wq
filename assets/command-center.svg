  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity=".34"/>
    <stop offset="60%" stop-color="#6366f1" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#05070e" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a2542"/><stop offset="100%" stop-color="#080d1a"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
  <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>

<rect width="900" height="470" rx="14" fill="#05070e"/>
