<!DOCTYPE html><title>India Map</title><div id="m" style="height:95vh"></div>
<script src="https://cdn.amcharts.com/lib/5/index.js"></script><script src="https://cdn.amcharts.com/lib/5/map.js"></script><script src="https://cdn.amcharts.com/lib/5/geodata/indiaLow.js"></script>
<script>const r = am5.Root.new("m"), t = r.container.children.push(am5map.MapChart.new(r, {})).series.push(am5map.MapPolygonSeries.new(r, {geoJSON: am5geodata_indiaLow})).mapPolygons.template, w = am5.color(0xffffff);
t.setAll({fill: w, stroke: am5.color(0x000000), cursorOverStyle: "pointer"}); t.states.create("hover", {fill: w}); t.events.on("click", e => open("https://en.wikipedia.org/wiki/" + e.target.dataItem.dataContext.name));</script>
