name: Update profile

# Regenerates the data-driven panels (build-log.svg, constellation.svg) from the
# GitHub REST API. Only the dynamic assets are rebuilt here - the narrative art in
# scripts/static_assets.py is editorial and is regenerated by hand when the content
# changes, so a daily run cannot churn it.

on:
  schedule:
    # 03:17 UTC daily - off the hour, where GitHub's scheduler is less congested.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_profile.py
      - scripts/theme.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate data-driven panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py

      - name: Commit only if the rendered output actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/build-log.svg assets/constellation.svg
          if git diff --staged --quiet; then
            echo "Panels unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile panels [skip ci]"
          git push
