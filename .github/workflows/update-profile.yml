name: Update profile

# Rebuilds the live panels (GitHub command centre and shipped repositories) from
# the GitHub REST + GraphQL APIs and LeetCode's public API. The editorial panels
# rendered by scripts/static_assets.py are regenerated by hand when the content
# changes, so a scheduled run can never churn them.

on:
  schedule:
    # 03:17 UTC daily - off the hour, where GitHub's scheduler is less congested.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_profile.py
      - scripts/theme.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate live panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py

      - name: Commit only if the rendered output actually changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-command-center.svg assets/m/github-command-center.svg \
                  assets/shipped-repos.svg assets/m/shipped-repos.svg
          if git diff --staged --quiet; then
            echo "Panels unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh profile panels [skip ci]"
          git push
