<script>
const Z = [['#e0824f','Jammu and Kashmir,Ladakh,Himachal Pradesh,Punjab,Chandigarh,Haryana,Delhi,Rajasthan'],
  ['#f0c070','Uttarakhand,Uttar Pradesh,Madhya Pradesh,Chhattisgarh'], ['#f3ec8a','Bihar,Jharkhand,West Bengal,Odisha'],
  ['#a98bc0','Sikkim,Arunachal Pradesh,Assam,Nagaland,Manipur,Mizoram,Tripura,Meghalaya'],
  ['#a8c98a','Gujarat,Maharashtra,Goa,Dadra and Nagar Haveli and Daman and Diu'],
  ['#d4569c','Telangana,Andhra Pradesh,Karnataka,Kerala,Tamil Nadu,Puducherry,Lakshadweep,Andaman and Nicobar Islands']];
google.charts.load('current', {packages: ['geochart']}).then(() => {
  const d = google.visualization.arrayToDataTable([['State','Zone'], ...Z.flatMap((z, i) => z[1].split(',').map(s => [s, i]))]);
  const c = new google.visualization.GeoChart(m);
  google.visualization.events.addListener(c, 'select', () => open('https://en.wikipedia.org/wiki/' + d.getValue(c.getSelection()[0].row, 0)));
  c.draw(d, {region: 'IN', resolution: 'provinces', legend: 'none', colorAxis: {values: Z.map((_, i) => i), colors: Z.map(z => z[0])}});
});
</script>
